<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Jarvis</title>
<link rel="manifest" href="manifest.json">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at 50% 30%, #0f1a2b 0%, #05080f 70%);
    color: #e6f1ff;
    font-family: -apple-system, Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
  }
  h1 {
    font-weight: 300;
    letter-spacing: 4px;
    font-size: 20px;
    color: #4fd1ff;
    margin-top: 24px;
  }
  #log {
    flex: 1;
    width: 100%;
    max-width: 480px;
    overflow-y: auto;
    padding: 12px 4px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    padding: 10px 14px;
    border-radius: 14px;
    max-width: 85%;
    line-height: 1.4;
    font-size: 15px;
  }
  .user {
    align-self: flex-end;
    background: #1c3a5e;
    color: #cfe8ff;
  }
  .ai {
    align-self: flex-start;
    background: #10233a;
    color: #9fe8ff;
    border: 1px solid #1e5578;
  }
  .status {
    color: #5a7a99;
    font-size: 13px;
    text-align: center;
    height: 18px;
    margin-bottom: 8px;
  }
  #micBtn {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(145deg, #0ea5e9, #0369a1);
    box-shadow: 0 0 0 0 rgba(14,165,233,0.6);
    color: white;
    font-size: 32px;
    margin-bottom: 28px;
    cursor: pointer;
    transition: transform 0.15s ease;
  }
  #micBtn.listening {
    animation: pulse 1.2s infinite;
    background: linear-gradient(145deg, #ef4444, #b91c1c);
  }
  #micBtn:active { transform: scale(0.94); }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(239,68,68,0.5); }
    70%  { box-shadow: 0 0 0 22px rgba(239,68,68,0); }
    100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); }
  }
  #settingsBtn {
    position: fixed;
    top: 16px;
    right: 16px;
    background: none;
    border: none;
    color: #4fd1ff;
    font-size: 20px;
    cursor: pointer;
  }
  #settingsPanel {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(5,8,15,0.96);
    z-index: 10;
    padding: 24px;
    flex-direction: column;
    gap: 14px;
  }
  #settingsPanel.open { display: flex; }
  #settingsPanel input, #settingsPanel textarea {
    background: #10233a;
    border: 1px solid #1e5578;
    color: #e6f1ff;
    padding: 10px;
    border-radius: 8px;
    font-size: 14px;
    width: 100%;
  }
  #settingsPanel label { font-size: 13px; color: #7fb8e0; }
  #settingsPanel button.save {
    background: #0ea5e9;
    border: none;
    color: white;
    padding: 12px;
    border-radius: 8px;
    font-size: 15px;
    margin-top: 8px;
    cursor: pointer;
  }
</style>
</head>
<body>

<button id="settingsBtn" onclick="toggleSettings()">⚙</button>
<h1>J A R V I S</h1>

<div id="log"></div>
<div class="status" id="status">Tap the mic to speak</div>
<button id="micBtn" onclick="toggleListen()">🎤</button>

<div id="settingsPanel">
  <label>Groq API Key</label>
  <input id="apiKey" type="password" placeholder="gsk_...">
  <label>System prompt (personality)</label>
  <textarea id="sysPrompt" rows="4">You are Jarvis, a concise, helpful voice assistant. Keep replies short and conversational since they will be spoken aloud.</textarea>
  <button class="save" onclick="saveSettings()">Save</button>
</div>

<script>
const log = document.getElementById('log');
const statusEl = document.getElementById('status');
const micBtn = document.getElementById('micBtn');

// ---- settings ----
function toggleSettings() {
  document.getElementById('settingsPanel').classList.toggle('open');
}
function saveSettings() {
  localStorage.setItem('groqKey', document.getElementById('apiKey').value.trim());
  localStorage.setItem('sysPrompt', document.getElementById('sysPrompt').value.trim());
  toggleSettings();
}
window.onload = () => {
  document.getElementById('apiKey').value = localStorage.getItem('groqKey') || '';
  document.getElementById('sysPrompt').value = localStorage.getItem('sysPrompt') ||
    document.getElementById('sysPrompt').value;
};

// ---- chat log ----
let history = [];
function addMsg(text, who) {
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

// ---- speech recognition ----
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition;
let listening = false;

if (SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.lang = 'en-US';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => {
    listening = true;
    micBtn.classList.add('listening');
    statusEl.textContent = 'Listening...';
  };
  recognition.onend = () => {
    listening = false;
    micBtn.classList.remove('listening');
  };
  recognition.onerror = (e) => {
    statusEl.textContent = 'Mic error: ' + e.error;
  };
  recognition.onresult = (e) => {
    const text = e.results[0][0].transcript;
    addMsg(text, 'user');
    sendToLLM(text);
  };
} else {
  statusEl.textContent = 'Speech recognition not supported in this browser';
}

function toggleListen() {
  if (!recognition) return;
  if (listening) {
    recognition.stop();
  } else {
    recognition.start();
  }
}

// ---- LLM call ----
async function sendToLLM(userText) {
  const key = localStorage.getItem('groqKey');
  if (!key) {
    statusEl.textContent = 'Set your Groq API key in settings first';
    toggleSettings();
    return;
  }
  statusEl.textContent = 'Thinking...';
  history.push({ role: 'user', content: userText });

  try {
    const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + key
      },
      body: JSON.stringify({
        model: 'llama-3.3-70b-versatile',
        messages: [
          { role: 'system', content: localStorage.getItem('sysPrompt') || 'You are a helpful voice assistant.' },
          ...history
        ],
        max_tokens: 300
      })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error.message);

    const reply = data.choices[0].message.content;
    history.push({ role: 'assistant', content: reply });
    addMsg(reply, 'ai');
    speak(reply);
  } catch (err) {
    statusEl.textContent = 'Error: ' + err.message;
  }
}

// ---- text to speech ----
function speak(text) {
  statusEl.textContent = 'Speaking...';
  const utter = new SpeechSynthesisUtterance(text);
  utter.rate = 1.0;
  utter.onend = () => { statusEl.textContent = 'Tap the mic to speak'; };
  speechSynthesis.cancel();
  speechSynthesis.speak(utter);
}

// register service worker for PWA (optional, ignore failure)
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
